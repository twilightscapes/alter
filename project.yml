name: Alter
options:
  bundleIdPrefix: app.altermedia
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "21"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AlterFree:
    type: application
    platform: macOS
    sources:
      - path: Core
      - path: FreeApp
      - path: Resources/Assets.xcassets
      - path: Tools/exiftool
        type: folder
        buildPhase: resources
      - path: Tools/cwebp
        buildPhase: resources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Alter Free
        PRODUCT_MODULE_NAME: Alter
        PRODUCT_BUNDLE_IDENTIFIER: app.altermedia.alter-free
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_CFBundleDisplayName: Alter Free
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Alter imports photos and videos from your Photos library when you ask it to.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Sign bundled cwebp
        script: |
          TOOL="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/cwebp"
          if [ -f "$TOOL" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TOOL"
          fi
