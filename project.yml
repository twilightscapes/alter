name: Alter
options:
  bundleIdPrefix: app.altermedia
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "22"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    # Optimized even in Debug: the pixel work (Retouch's heal and fill, the
    # renderer) runs ~75× slower unoptimized, so a Debug build wouldn't feel
    # like the app that ships.
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  AlterFree:
    type: application
    platform: macOS
    sources:
      - path: Core
      - path: FreeApp
      - path: Resources/Assets.xcassets
      - path: Tools/exiftool
        type: folder
        buildPhase: resources
      - path: Tools/cwebp
        buildPhase: resources
    # XcodeGen writes this file from the properties below on every
    # generate — edit them here, not in the plist.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDocumentTypes:
          # The .alterlib library is a Finder package: one document icon,
          # double-click opens Alter. Aperture libraries open read-only,
          # with an Alter catalog built beside them.
          - CFBundleTypeName: Alter Library
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [app.altermedia.alterlib]
          - CFBundleTypeName: Aperture Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSTypeIsPackage: true
            LSItemContentTypes: [com.apple.aperture.library]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.aperture.library
            UTTypeDescription: Aperture Library
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [aplibrary]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.altermedia.alterlib
            UTTypeDescription: Alter Library
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [alterlib]
    settings:
      base:
        PRODUCT_NAME: Alter Free
        PRODUCT_MODULE_NAME: Alter
        PRODUCT_BUNDLE_IDENTIFIER: app.altermedia.alter-free
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_CFBundleDisplayName: Alter Free
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Alter imports photos and videos from your Photos library when you ask it to.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Sign bundled cwebp
        script: |
          TOOL="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/cwebp"
          if [ -f "$TOOL" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TOOL"
          fi
